name: Zero-Downtime CI/CD Pipeline

# Trigger this pipeline every time code is pushed to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  # Phase 1: Continuous Integration (Testing)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run PyTest
        run: pytest

  # Phase 2: Continuous Delivery (Docker Build & Push)
  build-and-push:
    needs: test # This prevents deployment if the tests fail!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/triage-api:latest